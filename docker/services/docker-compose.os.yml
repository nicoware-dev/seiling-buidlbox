services:
  seiling-os-server:
    container_name: seiling-os-server
    build:
      context: ../../packages/seiling-os/server
      dockerfile: Dockerfile
    ports:
      - "${SEILING_OS_SERVER_PORT:-3737}:3737"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/seiling-os.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5174}
      - QDRANT_URL=${QDRANT_URL:-http://seiling-qdrant:6333}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - N8N_URL=${N8N_URL:-http://seiling-n8n:5678}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - FLOWISE_URL=${FLOWISE_URL:-http://seiling-flowise:3001}
      - FLOWISE_USERNAME=${FLOWISE_USERNAME:-admin}
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD:-}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://seiling-sei-mcp-server:3000}
    volumes:
      - seiling_os_data:/app/data
    networks:
      - seiling_network
    # Qdrant is optional - uncomment if Qdrant service is running
    # depends_on:
    #   - seiling-qdrant
    restart: unless-stopped

  seiling-os-ui:
    container_name: seiling-os-ui
    build:
      context: ../../packages/seiling-os/ui
      dockerfile: Dockerfile
    ports:
      - "${SEILING_OS_UI_PORT:-5174}:5174"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${SEILING_OS_API_URL:-http://localhost:3737}
    networks:
      - seiling_network
    depends_on:
      - seiling-os-server
    restart: unless-stopped

volumes:
  seiling_os_data:

networks:
  seiling_network:
    external: true

