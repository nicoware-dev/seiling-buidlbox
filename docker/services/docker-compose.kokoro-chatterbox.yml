services:
  kokoro:
    image: ${KOKORO_IMAGE:-sebastianboehler/kokoro-tts:latest}
    container_name: seiling-kokoro
    restart: unless-stopped
    environment:
      - ENABLE_KOKORO=${ENABLE_KOKORO:-no}
      - VOICE_MODEL=${VOICE_MODEL:-whisper}
    expose:
      - "${KOKORO_PORT:-3080}/tcp"
    networks:
      - seiling_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${KOKORO_PORT:-3080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    entrypoint: >
      sh -c '
      if [ "$ENABLE_KOKORO" = "yes" ] || [ "$ENABLE_KOKORO" = "true" ]; then
        echo "Starting Kokoro TTS/ASR...";
        exec /app/kokoro;
      else
        echo "Kokoro disabled by ENABLE_KOKORO=$ENABLE_KOKORO";
        sleep infinity;
      fi
      '

  chatterbox:
    image: ${CHATTERBOX_IMAGE:-bhimrazy/chatterbox-tts:latest}
    container_name: seiling-chatterbox
    restart: unless-stopped
    environment:
      - ENABLE_KOKORO=${ENABLE_KOKORO:-no}
      - KOKORO_API_URL=http://kokoro:${KOKORO_PORT:-3080}
      - CHATTERBOX_API_KEY=${CHATTERBOX_API_KEY:-}
    expose:
      - "${CHATTERBOX_PORT:-3008}/tcp"
    networks:
      - seiling_network
    depends_on:
      kokoro:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${CHATTERBOX_PORT:-3008}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    entrypoint: >
      sh -c '
      if [ "$ENABLE_KOKORO" = "yes" ] || [ "$ENABLE_KOKORO" = "true" ]; then
        echo "Starting Chatterbox...";
        exec /app/chatterbox;
      else
        echo "Chatterbox disabled by ENABLE_KOKORO=$ENABLE_KOKORO";
        sleep infinity;
      fi
      '
