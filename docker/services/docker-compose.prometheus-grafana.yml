services:
  prometheus:
    image: prom/prometheus:latest
    container_name: seiling-prometheus
    restart: unless-stopped
    environment:
      - ENABLE_PROMETHEUS=${ENABLE_PROMETHEUS:-no}
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    expose:
      - "9090/tcp"
    networks:
      - seiling_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    entrypoint: >
      sh -c '
      if [ "$ENABLE_PROMETHEUS" = "yes" ] || [ "$ENABLE_PROMETHEUS" = "true" ]; then
        echo "Starting Prometheus...";
        exec /bin/prometheus "$@";
      else
        echo "Prometheus disabled by ENABLE_PROMETHEUS=$ENABLE_PROMETHEUS";
        sleep infinity;
      fi
      '

  grafana:
    image: grafana/grafana:latest
    container_name: seiling-grafana
    restart: unless-stopped
    environment:
      - ENABLE_PROMETHEUS=${ENABLE_PROMETHEUS:-no}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    expose:
      - "3000/tcp"
    networks:
      - seiling_network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    entrypoint: >
      sh -c '
      if [ "$ENABLE_PROMETHEUS" = "yes" ] || [ "$ENABLE_PROMETHEUS" = "true" ]; then
        echo "Starting Grafana...";
        exec /run.sh;
      else
        echo "Grafana disabled by ENABLE_PROMETHEUS=$ENABLE_PROMETHEUS";
        sleep infinity;
      fi
      '

volumes:
  prometheus_data:
  grafana_data:

