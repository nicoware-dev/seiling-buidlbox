services:
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: seiling-langfuse-web
    restart: unless-stopped
    environment:
      - ENABLE_LANGFUSE=${ENABLE_LANGFUSE:-no}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-seiling123}@postgres:5432/${POSTGRES_DB:-seiling}
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minio
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET_NAME=langfuse
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
    expose:
      - "3000/tcp"
    networks:
      - seiling_network
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    entrypoint: >
      sh -c '
      if [ "$ENABLE_LANGFUSE" = "yes" ] || [ "$ENABLE_LANGFUSE" = "true" ]; then
        echo "Starting Langfuse web...";
        exec docker-entrypoint.sh start web;
      else
        echo "Langfuse web disabled by ENABLE_LANGFUSE=$ENABLE_LANGFUSE";
        sleep infinity;
      fi
      '

  langfuse-worker:
    image: langfuse/langfuse:3
    container_name: seiling-langfuse-worker
    restart: unless-stopped
    environment:
      - ENABLE_LANGFUSE=${ENABLE_LANGFUSE:-no}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-seiling123}@postgres:5432/${POSTGRES_DB:-seiling}
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minio
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET_NAME=langfuse
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
    networks:
      - seiling_network
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "langfuse.*worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    entrypoint: >
      sh -c '
      if [ "$ENABLE_LANGFUSE" = "yes" ] || [ "$ENABLE_LANGFUSE" = "true" ]; then
        echo "Starting Langfuse worker...";
        exec docker-entrypoint.sh start worker;
      else
        echo "Langfuse worker disabled by ENABLE_LANGFUSE=$ENABLE_LANGFUSE";
        sleep infinity;
      fi
      '

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: seiling-clickhouse
    restart: unless-stopped
    environment:
      - ENABLE_LANGFUSE=${ENABLE_LANGFUSE:-no}
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    expose:
      - "8123/tcp"
      - "9000/tcp"
    networks:
      - seiling_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint: >
      sh -c '
      if [ "$ENABLE_LANGFUSE" = "yes" ] || [ "$ENABLE_LANGFUSE" = "true" ]; then
        echo "Starting ClickHouse...";
        exec /entrypoint.sh;
      else
        echo "ClickHouse disabled by ENABLE_LANGFUSE=$ENABLE_LANGFUSE";
        sleep infinity;
      fi
      '

  minio:
    image: minio/minio:latest
    container_name: seiling-minio
    restart: unless-stopped
    environment:
      - ENABLE_LANGFUSE=${ENABLE_LANGFUSE:-no}
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - langfuse_minio_data:/data
    expose:
      - "9000/tcp"
      - "9001/tcp"
    networks:
      - seiling_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint: >
      sh -c '
      if [ "$ENABLE_LANGFUSE" = "yes" ] || [ "$ENABLE_LANGFUSE" = "true" ]; then
        echo "Starting MinIO...";
        exec /usr/bin/docker-entrypoint.sh server /data --console-address ":9001";
      else
        echo "MinIO disabled by ENABLE_LANGFUSE=$ENABLE_LANGFUSE";
        sleep infinity;
      fi
      '

volumes:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:

