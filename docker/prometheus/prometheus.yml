global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'seiling-buidlbox'
    environment: 'production'

# Alertmanager configuration (optional, can be added later)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           # - alertmanager:9093

# Load rules once and periodically evaluate them (optional)
# rule_files:
#   # - "first_rules.yml"
#   # - "second_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Sei MCP Server
  - job_name: 'sei-mcp'
    static_configs:
      - targets: ['sei-mcp-server:5004']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # N8N
  - job_name: 'n8n'
    static_configs:
      - targets: ['n8n:5678']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Captain
  - job_name: 'captain'
    static_configs:
      - targets: ['captain:3001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Node exporter (if enabled)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

