[project]
name = "seiling-os-server"
version = "0.1.0"
description = "FastAPI backend for Seiling OS"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "sqlalchemy==2.0.0",
  "alembic==1.13.0",
  "aiosqlite==0.19.0",
  "httpx==0.27.0",
  "beautifulsoup4==4.12.0",
  "qdrant-client==1.7.0",
  "openai==1.71.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

